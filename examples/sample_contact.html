<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>
<body>
    <main>
        <h1>Contact Us</h1>

        <form id="contactForm" data-testid="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input id="name" type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (optional)</label>
                <input id="phone" type="tel" placeholder="+1 (555) 123-4567">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" required>
                    <option value="">Choose a subject...</option>
                    <option value="support">Technical Support</option>
                    <option value="sales">Sales Inquiry</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Your message here..." rows="5" required></textarea>
            </div>

            <div class="form-group">
                <input type="checkbox" id="subscribe" aria-label="Subscribe to newsletter">
                <label for="subscribe">Subscribe to our newsletter</label>
            </div>

            <button type="submit" data-testid="submit-btn">Send Message</button>
            <button type="reset" aria-label="Reset form">Clear Form</button>
        </form>

        <div id="successMessage" role="status" style="display: none;">
            Thank you for your message!
        </div>
    </main>
</body>
</html>
