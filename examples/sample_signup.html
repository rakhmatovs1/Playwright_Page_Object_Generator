<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <form id="signupForm">
        <h1>Create Account</h1>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="firstName">First Name</label>
            <input id="firstName" type="text" placeholder="John" required>

            <label for="lastName">Last Name</label>
            <input id="lastName" type="text" placeholder="Doe" required>

            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="john@example.com" required>
        </fieldset>

        <fieldset>
            <legend>Security</legend>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Min 8 characters" required>

            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="Repeat password" required>

            <input type="checkbox" id="terms" aria-label="Agree to terms" required>
            <label for="terms">I agree to Terms & Conditions</label>
        </fieldset>

        <button type="submit" class="btn btn-success">Create Account</button>
        <a href="/login">Already have an account? Sign in</a>
    </form>
</body>
</html>
